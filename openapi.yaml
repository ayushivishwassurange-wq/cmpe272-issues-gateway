openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  /:
    get:
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /github-test:
    get:
      summary: Github Test
      operationId: github_test_github_test_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /issues:
    post:
      summary: Create Issue
      operationId: create_issue_issues_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Get Issues
      operationId: get_issues_issues_get
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
          default: open
          title: State
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 30
          title: Per Page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /issues/{number}:
    get:
      summary: Get Issue
      operationId: get_issue_issues__number__get
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      summary: Update Issue
      operationId: update_issue_issues__number__patch
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /issues/{number}/comments:
    post:
      summary: Add Comment
      operationId: add_comment_issues__number__comments_post
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /healthz:
    get:
      summary: Health
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /webhook:
    post:
      summary: Webhook
      operationId: webhook_webhook_post
      responses:
        '204':
          description: Successful Response
  /webhooks:
    get:
      summary: Get Webhooks
      operationId: get_webhooks_webhooks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    CreateCommentRequest:
      properties:
        body:
          type: string
          title: Body
      type: object
      required:
      - body
      title: CreateCommentRequest
    CreateIssueRequest:
      properties:
        title:
          type: string
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        labels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Labels
          default: []
      type: object
      required:
      - title
      title: CreateIssueRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    UpdateIssueRequest:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      type: object
      title: UpdateIssueRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
